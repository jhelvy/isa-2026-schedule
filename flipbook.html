<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISA 2026 Schedule — Flipbook</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://unpkg.com/page-flip/dist/js/page-flip.browser.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            height: 100vh;
            overflow: hidden; /* reader is the scroll container, not the window */
            display: flex;
            flex-direction: column;
            line-height: 1.6;
            color: #212529;
        }

        header {
            background: white;
            border-bottom: 1px solid #dee2e6;
            padding: 15px 20px;
            box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            gap: 15px;
            flex-shrink: 0;
            z-index: 10;
        }

        .logo { height: 50px; width: auto; }
        .header-text { flex: 1; }
        .header-text h1 { font-size: 1.5em; margin-bottom: 2px; color: #0d6efd; font-weight: 600; }
        .header-text p  { font-size: 0.9em; color: #6c757d; }
        .header-actions { display: flex; gap: 10px; }

        .header-btn {
            text-decoration: none; padding: 7px 16px; border-radius: 6px;
            font-size: 0.85em; font-weight: 500; transition: all 0.2s;
            border: 1px solid; white-space: nowrap;
        }
        .btn-outline { background: white; color: #0d6efd; border-color: #0d6efd; }
        .btn-outline:hover { background: #0d6efd; color: white; }
        .btn-primary { background: #0d6efd; color: white; border-color: #0d6efd; }
        .btn-primary:hover { background: #0b5ed7; border-color: #0b5ed7; }

        /*
         * .reader is the scroll container — fixed height from flex:1 + body height:100vh.
         * No padding/centering here; that lives in .reader-inner.
         */
        .reader {
            flex: 1;
            overflow: auto;
            background: linear-gradient(160deg, #1a1a2e 0%, #16213e 60%, #0f3460 100%);
        }

        /*
         * min-width: max-content makes the inner wrapper always at least as wide as
         * the book. This lets the reader scroll to BOTH left and right edges —
         * without it, overflow:auto + align-items:center clips the left side.
         * min-height:100% keeps the background filled when content is short.
         */
        .reader-inner {
            min-width: max-content;
            min-height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px 100px;
        }

        /* Loading */
        #loading {
            display: flex; flex-direction: column; align-items: center;
            gap: 16px; color: rgba(255,255,255,0.85); text-align: center;
        }
        .spinner {
            width: 44px; height: 44px;
            border: 3px solid rgba(255,255,255,0.12); border-top-color: #4d90fe;
            border-radius: 50%; animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading h2 { font-size: 1.2em; font-weight: 500; }
        #loading p  { font-size: 0.85em; color: rgba(255,255,255,0.5); }
        .progress-track {
            width: 260px; height: 4px; background: rgba(255,255,255,0.1);
            border-radius: 4px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; background: #4d90fe; border-radius: 4px;
            transition: width 0.25s ease; width: 0%;
        }

        .book-shadow {
            filter: drop-shadow(0 24px 48px rgba(0,0,0,0.65))
                    drop-shadow(0 6px 16px rgba(0,0,0,0.5));
            position: relative; /* anchor for pan-overlay */
        }

        /*
         * Transparent overlay sitting on top of the flipbook canvas.
         * Captures all pointer events so we can distinguish click-to-flip
         * from click-and-drag-to-pan before deciding which action to take.
         */
        #pan-overlay {
            position: absolute;
            inset: 0;
            z-index: 5;
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
        }
        #pan-overlay.panning { cursor: grabbing; }

        /*
         * Fixed controls bar — always visible at the bottom of the viewport,
         * floating above everything including the book at any zoom level.
         * Solid blue background so it stays legible over white PDF pages.
         */
        #controls-bar {
            display: none; /* shown after load */
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            align-items: center;
            gap: 10px;
            background: #0d6efd;
            border-radius: 50px;
            padding: 8px 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            white-space: nowrap;
        }

        .ctrl-btn {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.35);
            color: white;
            padding: 5px 14px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.87em;
            font-weight: 500;
            transition: background 0.15s;
        }
        .ctrl-btn:hover:not(:disabled) { background: rgba(255,255,255,0.28); }
        .ctrl-btn:disabled { opacity: 0.38; cursor: not-allowed; }
        .ctrl-btn.active   { background: rgba(255,255,255,0.35); }

        .ctrl-sep { width: 1px; height: 20px; background: rgba(255,255,255,0.35); flex-shrink: 0; }

        #page-info { color: white; font-size: 0.87em; min-width: 72px; text-align: center; }

        .zoom-group { display: flex; align-items: center; gap: 5px; }
        .zoom-btn {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.35);
            color: white; width: 26px; height: 26px; border-radius: 50%;
            cursor: pointer; font-size: 1.1em;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.15s; flex-shrink: 0;
        }
        .zoom-btn:hover:not(:disabled) { background: rgba(255,255,255,0.28); }
        .zoom-btn:disabled { opacity: 0.38; cursor: not-allowed; }
        #zoom-label { color: white; font-size: 0.82em; min-width: 38px; text-align: center; }

        /* Hint text sits just above the controls bar */
        #hint {
            display: none;
            position: fixed;
            bottom: 74px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.28);
            font-size: 0.72em;
            pointer-events: none;
            white-space: nowrap;
            z-index: 999;
        }

        /* Bookmarks panel */
        #bm-panel {
            position: fixed; top: 0; left: -340px; width: 320px; height: 100vh;
            background: #1a1a2e; border-right: 1px solid rgba(255,255,255,0.1);
            z-index: 1500; display: flex; flex-direction: column;
            transition: left 0.3s ease; box-shadow: 4px 0 24px rgba(0,0,0,0.55);
        }
        #bm-panel.open { left: 0; }

        #bm-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.4); z-index: 1499;
        }
        #bm-overlay.show { display: block; }

        .bm-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 18px; border-bottom: 1px solid rgba(255,255,255,0.1); flex-shrink: 0;
        }
        .bm-title { color: white; font-size: 1em; font-weight: 600; }
        .bm-close {
            background: none; border: none; color: rgba(255,255,255,0.5);
            cursor: pointer; font-size: 1.3em; padding: 4px; transition: color 0.2s;
        }
        .bm-close:hover { color: white; }

        #bm-list { overflow-y: auto; flex: 1; padding: 8px 0; }

        .bm-item {
            display: block; padding: 9px 18px; color: rgba(255,255,255,0.75);
            font-size: 0.875em; cursor: pointer; border: none; background: none;
            text-align: left; width: 100%; line-height: 1.4;
            transition: background 0.15s, color 0.15s;
        }
        .bm-item:hover { background: rgba(255,255,255,0.08); color: white; }
        .bm-item.child  { padding-left: 34px; font-size: 0.82em; color: rgba(255,255,255,0.5); }
        .bm-item.child:hover { color: rgba(255,255,255,0.85); }
        .bm-msg { padding: 20px 18px; color: rgba(255,255,255,0.4); font-size: 0.875em; }

        @media (max-width: 600px) {
            .header-actions { display: none; }
            .header-text h1 { font-size: 1.2em; }
            #bm-panel { width: min(300px, 90vw); }
            #controls-bar { max-width: calc(100vw - 24px); flex-wrap: wrap; border-radius: 16px; bottom: 12px; }
            #hint { display: none !important; }
        }
    </style>
</head>
<body>

<header>
    <img src="logo.png" alt="ISA Logo" class="logo">
    <div class="header-text">
        <h1>ISA 2026 Conference Schedule</h1>
        <p>Industry Studies Association Annual Conference | June 3–5, 2026</p>
    </div>
    <div class="header-actions">
        <a href="index.html" class="header-btn btn-outline">&#8592; Interactive Schedule</a>
        <a href="schedule.pdf" download class="header-btn btn-primary">Download PDF</a>
    </div>
</header>

<!-- Bookmarks panel (fixed, outside the reader) -->
<div id="bm-overlay"></div>
<div id="bm-panel">
    <div class="bm-header">
        <span class="bm-title">&#9776;&nbsp; Contents</span>
        <button class="bm-close" id="bm-close">&#10005;</button>
    </div>
    <div id="bm-list"><p class="bm-msg">Loading…</p></div>
</div>

<div class="reader">
    <div class="reader-inner">
        <div id="loading">
            <div class="spinner"></div>
            <h2>Loading Schedule</h2>
            <p id="status-text">Preparing…</p>
            <div class="progress-track">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
        </div>

        <div class="book-shadow" id="book-shadow" style="display:none;">
            <div id="flipbook"></div>
        </div>
    </div>
</div>

<!-- Fixed controls bar — outside the scrollable reader -->
<div id="controls-bar">
    <button class="ctrl-btn" id="bm-btn">&#9776; Contents</button>
    <div class="ctrl-sep"></div>
    <button class="ctrl-btn" id="prev-btn" disabled>&#8592; Prev</button>
    <span id="page-info">— / —</span>
    <button class="ctrl-btn" id="next-btn">Next &#8594;</button>
    <div class="ctrl-sep"></div>
    <div class="zoom-group">
        <button class="zoom-btn" id="zoom-out" title="Zoom out (-)">&#8722;</button>
        <span id="zoom-label">100%</span>
        <button class="zoom-btn" id="zoom-in" title="Zoom in (+)">&#43;</button>
    </div>
</div>
<p id="hint">Drag the page edge to flip &nbsp;·&nbsp; Arrow keys to navigate &nbsp;·&nbsp; +/&#8722; to zoom</p>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let pageFlip = null;
    let numPages = 0;

    /*
     * ZOOM STRATEGY — reinit PageFlip at the correct pixel size each zoom step.
     *
     * Why not CSS scale? PageFlip computes click/drag zones using its initialized
     * width/height. CSS-scaling the container creates a mismatch between the visual
     * page edge positions and the coordinates PageFlip uses for zone detection,
     * making page-turn clicks unreliable at lower zoom levels.
     *
     * Instead: pre-render all PDF pages at ZOOM_MAX × display resolution (for
     * quality). On zoom change, destroy + recreate PageFlip at the target pixel
     * size and pass the same pre-rendered image URLs. PageFlip downsamples from
     * the high-res source — no PDF re-render needed, so it's fast.
     */
    const ZOOM_MAX   = 2.0;
    const ZOOM_STEPS = [0.6, 0.75, 0.85, 1.0, 1.15, 1.3, 1.5, 1.75, 2.0];
    let   zoomIdx    = 3; // index for 100%

    // Set during init; used by applyZoom
    let imageUrls    = [];
    let basePageW    = 0;
    let basePageH    = 0;
    let isMobileBook = false;

    // ── Pan + click overlay ────────────────────────────────────────────────
    // Short click  → flip page (left half = prev, right half = next)
    // Click + drag → pan the reader scroll container
    const PAN_THRESHOLD = 6; // px movement before pan mode activates

    function setupPanOverlay() {
        const overlay = document.getElementById('pan-overlay');
        const reader  = document.querySelector('.reader');
        if (!overlay || !pageFlip) return;

        overlay.addEventListener('mousedown', e => {
            if (e.button !== 0) return;
            e.preventDefault();

            let panning = false;
            const startX = e.clientX, startY = e.clientY;
            const scrollX = reader.scrollLeft, scrollY = reader.scrollTop;

            function onMove(ev) {
                const dx = ev.clientX - startX, dy = ev.clientY - startY;
                if (!panning && Math.hypot(dx, dy) > PAN_THRESHOLD) {
                    panning = true;
                    overlay.classList.add('panning');
                }
                if (panning) {
                    reader.scrollLeft = scrollX - dx;
                    reader.scrollTop  = scrollY - dy;
                }
            }

            function onUp(ev) {
                document.removeEventListener('mousemove', onMove);
                document.removeEventListener('mouseup',   onUp);
                overlay.classList.remove('panning');
                if (!panning) {
                    // Treat as click — flip based on which half was clicked
                    const rect = overlay.getBoundingClientRect();
                    if (ev.clientX - rect.left < rect.width / 2) pageFlip?.flipPrev();
                    else                                           pageFlip?.flipNext();
                }
            }

            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup',   onUp);
        });

        // Touch: tap to flip, drag to pan
        let touchStart = null, touchScrollX = 0, touchScrollY = 0, touchPanning = false;

        overlay.addEventListener('touchstart', e => {
            touchStart   = e.touches[0];
            touchScrollX = reader.scrollLeft;
            touchScrollY = reader.scrollTop;
            touchPanning = false;
        }, { passive: true });

        overlay.addEventListener('touchmove', e => {
            if (!touchStart) return;
            const dx = e.touches[0].clientX - touchStart.clientX;
            const dy = e.touches[0].clientY - touchStart.clientY;
            if (!touchPanning && Math.hypot(dx, dy) > PAN_THRESHOLD) touchPanning = true;
            if (touchPanning) {
                e.preventDefault();
                reader.scrollLeft = touchScrollX - dx;
                reader.scrollTop  = touchScrollY - dy;
            }
        }, { passive: false });

        overlay.addEventListener('touchend', e => {
            if (!touchPanning && touchStart) {
                const t    = e.changedTouches[0];
                const rect = overlay.getBoundingClientRect();
                if (t.clientX - rect.left < rect.width / 2) pageFlip?.flipPrev();
                else                                          pageFlip?.flipNext();
            }
            touchStart = null; touchPanning = false;
        });
    }

    function applyZoom() {
        if (!imageUrls.length) return; // not ready yet

        const zoom        = ZOOM_STEPS[zoomIdx];
        const targetPageW = Math.round(basePageW * zoom);
        const targetPageH = Math.round(basePageH * zoom);
        const savedPage   = pageFlip ? pageFlip.getCurrentPageIndex() : 0;

        // Destroy old instance (recreate container div to avoid stale DOM)
        if (pageFlip) {
            pageFlip.destroy();
            pageFlip = null;
        }
        const bookShadow = document.getElementById('book-shadow');
        bookShadow.innerHTML = '<div id="flipbook"></div><div id="pan-overlay"></div>';

        pageFlip = new St.PageFlip(document.getElementById('flipbook'), {
            width:               targetPageW,
            height:              targetPageH,
            size:                'fixed',
            drawShadow:          true,
            flippingTime:        750,
            useMouseEvents:      false, /* pan-overlay handles all pointer events */
            showCover:           true,
            mobileScrollSupport: false,
            maxShadowOpacity:    0.45,
            usePortrait:         isMobileBook,
        });

        pageFlip.loadFromImages(imageUrls);
        pageFlip.on('flip',        updateUI);
        pageFlip.on('changeState', updateUI);

        // Restore page position after PageFlip finishes its initial render
        if (savedPage > 0) {
            setTimeout(() => pageFlip?.turnToPage(savedPage), 150);
        }

        setupPanOverlay();

        document.getElementById('zoom-label').textContent = `${Math.round(zoom * 100)}%`;
        document.getElementById('zoom-out').disabled = zoomIdx <= 0;
        document.getElementById('zoom-in').disabled  = zoomIdx >= ZOOM_STEPS.length - 1;
        updateUI();
    }

    document.getElementById('zoom-in').addEventListener('click', () => {
        if (zoomIdx < ZOOM_STEPS.length - 1) { zoomIdx++; applyZoom(); }
    });
    document.getElementById('zoom-out').addEventListener('click', () => {
        if (zoomIdx > 0) { zoomIdx--; applyZoom(); }
    });

    // ── Bookmarks ─────────────────────────────────────────────────────────
    const bmPanel   = document.getElementById('bm-panel');
    const bmOverlay = document.getElementById('bm-overlay');
    const bmList    = document.getElementById('bm-list');
    const bmBtn     = document.getElementById('bm-btn');

    const openBm  = () => { bmPanel.classList.add('open');    bmOverlay.classList.add('show');    bmBtn.classList.add('active'); };
    const closeBm = () => { bmPanel.classList.remove('open'); bmOverlay.classList.remove('show'); bmBtn.classList.remove('active'); };

    bmBtn.addEventListener('click', () => bmPanel.classList.contains('open') ? closeBm() : openBm());
    document.getElementById('bm-close').addEventListener('click', closeBm);
    bmOverlay.addEventListener('click', closeBm);

    async function buildBookmarks(pdf) {
        let outline;
        try { outline = await pdf.getOutline(); } catch(e) { outline = null; }
        bmList.innerHTML = '';
        if (!outline || !outline.length) {
            bmList.innerHTML = '<p class="bm-msg">No table of contents found in this PDF.</p>';
            return;
        }
        async function pageIdx(dest) {
            if (!dest) return 0;
            try {
                const d = typeof dest === 'string' ? await pdf.getDestination(dest) : dest;
                return d ? await pdf.getPageIndex(d[0]) : 0;
            } catch(e) { return 0; }
        }
        async function addItems(items, depth) {
            for (const item of items) {
                const pi  = await pageIdx(item.dest);
                const btn = document.createElement('button');
                btn.className   = 'bm-item' + (depth > 0 ? ' child' : '');
                btn.textContent = item.title;
                btn.title       = `Go to page ${pi + 1}`;
                btn.addEventListener('click', () => { pageFlip?.turnToPage(pi); closeBm(); });
                bmList.appendChild(btn);
                if (item.items?.length) await addItems(item.items, depth + 1);
            }
        }
        await addItems(outline, 0);
    }

    // ── Main init ─────────────────────────────────────────────────────────
    async function init() {
        const statusEl = document.getElementById('status-text');
        const fillEl   = document.getElementById('progress-fill');

        try {
            statusEl.textContent = 'Loading PDF…';
            const pdf = await pdfjsLib.getDocument('schedule.pdf').promise;
            numPages  = pdf.numPages;
            buildBookmarks(pdf);

            const firstPage = await pdf.getPage(1);
            const baseVP    = firstPage.getViewport({ scale: 1 });
            const aspect    = baseVP.height / baseVP.width;

            const headerH  = document.querySelector('header').getBoundingClientRect().height;
            const availH   = window.innerHeight - headerH - 110;
            const availW   = window.innerWidth - 80;
            isMobileBook   = window.innerWidth < 700;

            // 100%-zoom display dimensions per page
            if (isMobileBook) {
                basePageW = Math.round(Math.max(200, Math.min(availW, availH / aspect)));
            } else {
                const maxByW = Math.floor(availW / 2) - 8;
                basePageW = Math.max(220, Math.min(maxByW, Math.floor(availH / aspect)));
            }
            basePageH = Math.round(basePageW * aspect);

            // Render source images at ZOOM_MAX × display size for quality
            const renderPageW = Math.round(basePageW * ZOOM_MAX);
            const renderScale = renderPageW / baseVP.width;

            for (let p = 1; p <= numPages; p++) {
                statusEl.textContent = `Rendering page ${p} of ${numPages}…`;
                fillEl.style.width   = `${(p / numPages) * 100}%`;

                const page   = await pdf.getPage(p);
                const vp     = page.getViewport({ scale: renderScale });
                const canvas = document.createElement('canvas');
                canvas.width  = vp.width;
                canvas.height = vp.height;

                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, vp.width, vp.height);
                await page.render({ canvasContext: ctx, viewport: vp }).promise;

                imageUrls.push(canvas.toDataURL('image/jpeg', 0.92));
                canvas.width = 0;
            }

            // Reveal book
            document.getElementById('loading').style.display = 'none';
            document.getElementById('book-shadow').style.display = '';
            document.getElementById('controls-bar').style.display = 'flex';
            document.getElementById('hint').style.display = '';

            applyZoom(); // create PageFlip at 100% zoom
            updateUI();

        } catch(err) {
            console.error('Flipbook error:', err);
            document.getElementById('status-text').textContent =
                'Could not load schedule.pdf — please refresh the page.';
        }
    }

    function updateUI() {
        if (!pageFlip) return;
        const idx = pageFlip.getCurrentPageIndex();
        document.getElementById('page-info').textContent = `${idx + 1} / ${numPages}`;
        document.getElementById('prev-btn').disabled = idx <= 0;
        document.getElementById('next-btn').disabled = idx >= numPages - 1;
    }

    document.getElementById('prev-btn').addEventListener('click', () => pageFlip?.flipPrev());
    document.getElementById('next-btn').addEventListener('click', () => pageFlip?.flipNext());

    document.addEventListener('keydown', e => {
        if (e.key === 'ArrowLeft')  pageFlip?.flipPrev();
        if (e.key === 'ArrowRight') pageFlip?.flipNext();
        if ((e.key === '=' || e.key === '+') && zoomIdx < ZOOM_STEPS.length - 1) { zoomIdx++; applyZoom(); }
        if (e.key === '-' && zoomIdx > 0) { zoomIdx--; applyZoom(); }
    });

    init();
</script>
</body>
</html>
