<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISA 2026 Conference Schedule</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #212529;
            background: #f8f9fa;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: white;
            border-bottom: 1px solid #dee2e6;
            color: #212529;
            padding: 15px 20px;
            box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo {
            height: 50px;
            width: auto;
        }

        .header-text h1 {
            font-size: 1.5em;
            margin-bottom: 2px;
            color: #0d6efd;
            font-weight: 600;
        }

        .header-text p {
            font-size: 0.9em;
            color: #6c757d;
        }

        .main-container {
            display: flex;
            flex: 1;
            max-width: 1800px;
            margin: 0 auto;
            width: 100%;
        }

        .sidebar {
            width: 300px;
            background: white;
            padding: 1.5rem;
            border-right: 1px solid #dee2e6;
            overflow-y: auto;
            position: sticky;
            top: 0;
            height: calc(100vh - 82px);
        }

        .sidebar h2 {
            font-size: 1.1em;
            margin-bottom: 1rem;
            color: #495057;
            font-weight: 600;
        }

        .day-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .day-tab {
            flex: 1;
            min-width: fit-content;
            padding: 0.5rem 0.75rem;
            background: white;
            border: 1px solid #ced4da;
            border-radius: 0.375rem;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: 500;
            color: #495057;
            text-align: center;
            transition: all 0.15s ease-in-out;
        }

        .day-tab:hover {
            background: #f8f9fa;
            border-color: #86b7fe;
        }

        .day-tab.active {
            background: #0d6efd;
            border-color: #0d6efd;
            color: white;
        }

        .mobile-filter-toggle {
            display: none;
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            background: #0d6efd;
            color: white;
            border: none;
            border-radius: 50%;
            width: 56px;
            height: 56px;
            font-size: 1.5em;
            cursor: pointer;
            box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.15);
            z-index: 1000;
            transition: all 0.15s ease-in-out;
        }

        .mobile-filter-toggle:hover {
            background: #0b5ed7;
            transform: scale(1.05);
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 999;
        }

        .control-item {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }

        label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #555;
            font-size: 0.85em;
        }

        .track-select-wrapper {
            position: relative;
        }

        .track-select-wrapper::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            border-radius: 4px 0 0 4px;
            background: var(--track-color, #d1d5db);
            pointer-events: none;
            z-index: 1;
            transition: background 0.3s;
        }

        .track-select-wrapper select {
            padding-left: 12px;
            width: 100%;
        }

        input, select {
            padding: 0.5rem 0.75rem;
            border: 1px solid #ced4da;
            border-radius: 0.375rem;
            font-size: 0.95em;
            transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
            width: 100%;
            background-color: #fff;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #86b7fe;
            box-shadow: 0 0 0 0.25rem rgba(13,110,253,0.25);
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e5e5e5;
        }

        .expand-all {
            background: #0d6efd;
            color: white;
            border: 1px solid #0d6efd;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.15s ease-in-out;
            width: 100%;
            font-weight: 500;
        }

        .expand-all:hover {
            background: #0b5ed7;
            border-color: #0a58ca;
        }

        .stats {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e5e5e5;
        }

        .stat {
            font-size: 0.85em;
            color: #666;
        }

        .stat strong {
            color: #1e3a8a;
            font-size: 1em;
        }

        .content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        /* Track colors */
        .cat-general      { border-left: 5px solid #E69F00 !important; }
        .cat-health       { border-left: 5px solid #56B4E9 !important; }
        .cat-innovation   { border-left: 5px solid #CC79A7 !important; }
        .cat-labor        { border-left: 5px solid #F0E442 !important; }
        .cat-operations   { border-left: 5px solid #0072B2 !important; }
        .cat-policy       { border-left: 5px solid #D55E00 !important; }
        .cat-sustainability { border-left: 5px solid #009E73 !important; }
        .cat-special      { border-left: 5px solid #6f42c1 !important; }
        .cat-event        { border-left: 5px solid #17a2b8 !important; background: #f0fbfd; }

        .event-card .session-header { cursor: default; }
        .event-card .session-header:hover { background: #f0fbfd; }

        .badge-event {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .session-group {
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
            box-shadow: 0 0.125rem 0.25rem rgba(0,0,0,0.075);
            overflow: hidden;
            transition: box-shadow 0.15s ease-in-out;
        }

        .session-group:hover {
            box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.1);
        }

        .session-header {
            background: white;
            color: #212529;
            padding: 1rem 1.25rem;
            cursor: pointer;
            user-select: none;
            transition: background 0.15s ease-in-out;
        }

        .session-header:hover {
            background: #f8f9fa;
        }

        .session-meta {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 10px;
        }

        .session-title-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 8px;
        }

        .session-title {
            font-size: 1.3em;
            font-weight: 600;
        }

        .session-badge {
            display: inline-block;
            padding: 0.15rem 0.5rem;
            border-radius: 0.25rem;
            font-size: 0.65em;
            font-weight: 700;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            vertical-align: middle;
            white-space: nowrap;
        }

        .badge-plenary {
            background: #fff3cd;
            color: #664d03;
            border: 1px solid #ffda6a;
        }

        .badge-special {
            background: #e8d5ff;
            color: #3d0070;
            border: 1px solid #c49af0;
        }

        .session-info {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            font-size: 0.95em;
            opacity: 0.95;
        }

        .session-info span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .session-papers {
            padding: 0;
            display: none;
        }

        .session-group.expanded .session-papers {
            display: block;
        }

        .paper {
            padding: 20px;
            border-bottom: 1px solid #e5e5e5;
        }

        .paper:last-child {
            border-bottom: none;
        }

        .paper-title {
            font-size: 1.05em;
            font-weight: 600;
            color: #212529;
            margin-bottom: 0.5rem;
        }

        .paper-authors {
            color: #6c757d;
            font-size: 0.9em;
            margin-bottom: 0.75rem;
        }

        .session-chair {
            font-size: 0.9em;
            color: #495057;
            padding: 12px 20px 4px 20px;
        }

        .session-discussant {
            font-size: 0.9em;
            color: #495057;
            padding: 4px 20px 12px 20px;
        }

        .paper-category {
            display: inline-block;
            background: #e7f1ff;
            color: #084298;
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            font-size: 0.85em;
            margin-bottom: 0.75rem;
            border: 1px solid #b6d4fe;
        }

        .abstract-toggle {
            background: #adb5bd;
            color: white;
            border: 1px solid #adb5bd;
            padding: 0.375rem 0.75rem;
            border-radius: 0.375rem;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.15s ease-in-out;
            font-weight: 500;
        }

        .abstract-toggle:hover {
            background: #9aa0a6;
            border-color: #9aa0a6;
        }

        .abstract {
            display: none;
            margin-top: 1rem;
            padding: 1rem;
            background: #f0f1f2;
            border-radius: 0.375rem;
            color: #495057;
            line-height: 1.7;
        }

        .abstract.visible {
            display: block;
        }

        /* Special session (panel) content styles */
        .panel-moderator {
            font-size: 0.95em;
            margin-bottom: 0.75rem;
        }

        .panel-panelists {
            font-size: 0.95em;
            margin-bottom: 0.75rem;
        }

        .panel-panelists ul {
            margin: 0.3rem 0 0 1.5rem;
            padding: 0;
        }

        .panel-panelists li {
            margin-bottom: 0.2rem;
            color: #495057;
        }

        .panel-description {
            margin-top: 0.75rem;
            padding: 1rem;
            background: #f8f9fa;
            border-left: 4px solid #6f42c1;
            border-radius: 0.375rem;
            color: #495057;
            line-height: 1.7;
            font-size: 0.95em;
            white-space: pre-line;
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: #666;
            background: white;
            border-radius: 8px;
        }

        .no-results h2 {
            font-size: 1.5em;
            margin-bottom: 10px;
        }

        @media (max-width: 1024px) {
            .main-container { flex-direction: column; }

            .sidebar {
                position: fixed;
                left: -100%;
                top: 0;
                width: 320px;
                max-width: 85vw;
                height: 100vh;
                z-index: 1000;
                transition: left 0.3s ease-in-out;
                box-shadow: 0.5rem 0 1rem rgba(0,0,0,0.15);
                overflow-y: auto;
            }

            .sidebar.mobile-open { left: 0; }
            .sidebar-overlay.show { display: block; }
            .mobile-filter-toggle { display: block; }

            .content { padding: 1rem; }

            header {
                flex-direction: column;
                align-items: flex-start;
            }

            .logo { height: 40px; }
            .header-text h1 { font-size: 1.3em; }
            .day-tabs { flex-direction: column; }
            .day-tab { width: 100%; }
            .header-btns { margin-left: 0; align-self: flex-start; }
            .header-btn { padding: 5px 10px; font-size: 0.78em; }
        }

        .header-btns {
            display: flex;
            gap: 8px;
            margin-left: auto;
            flex-shrink: 0;
        }

        .header-btn {
            text-decoration: none;
            padding: 7px 14px;
            border-radius: 6px;
            font-size: 0.82em;
            font-weight: 500;
            border: 1px solid;
            white-space: nowrap;
            transition: background 0.2s, color 0.2s;
        }

        .header-btn-blue {
            color: #0d6efd;
            border-color: #0d6efd;
            background: white;
        }
        .header-btn-blue:hover { background: #0d6efd; color: white; }

        .header-btn-gray {
            color: #6c757d;
            border-color: #6c757d;
            background: white;
        }
        .header-btn-gray:hover { background: #6c757d; color: white; }

        .session-category {
            font-weight: 600;
            font-size: 0.9em;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2em;
            color: #666;
        }

        label.filter-active {
            color: #0d6efd;
        }
        label.filter-active::after {
            content: ' ●';
            font-size: 0.65em;
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <header>
        <img src="logo.png" alt="ISA Logo" class="logo">
        <div class="header-text">
            <h1>ISA 2026 Conference Schedule</h1>
            <p>Industry Studies Association Annual Conference | June 3-5, 2026</p>
        </div>
        <div class="header-btns">
            <a href="flipbook.html" class="header-btn header-btn-blue">Flipbook (PDF)</a>
            <a href="schedule.pdf" download class="header-btn header-btn-gray">Download (PDF)</a>
        </div>
    </header>

    <div class="main-container">
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <aside class="sidebar" id="sidebar">
            <h2>Filters & Options</h2>

            <div class="day-tabs">
                <button class="day-tab active" data-day="">All Days</button>
                <button class="day-tab" data-day="Wednesday">Wed</button>
                <button class="day-tab" data-day="Thursday">Thu</button>
                <button class="day-tab" data-day="Friday">Fri</button>
            </div>

            <div class="control-item">
                <label for="search">Search</label>
                <input type="text" id="search" placeholder="Title, authors, abstract...">
            </div>

            <div class="control-item">
                <label for="timeSlotFilter">Time Slot</label>
                <select id="timeSlotFilter">
                    <option value="">All Time Slots</option>
                </select>
            </div>

            <div class="control-item">
                <label for="trackFilter">Track</label>
                <div class="track-select-wrapper">
                    <select id="trackFilter">
                        <option value="">All Tracks</option>
                    </select>
                </div>
            </div>

            <div class="control-item">
                <label for="typeFilter">Session Type</label>
                <select id="typeFilter">
                    <option value="">All Types</option>
                    <option value="paper">Paper Sessions</option>
                    <option value="special">Special Sessions</option>
                    <option value="event">Social Events</option>
                </select>
            </div>

            <div class="button-group">
                <button class="expand-all" id="expandAll">Expand All Sessions</button>
                <button class="expand-all" id="collapseAll" style="background: #dc3545; border-color: #dc3545;">Collapse All Sessions</button>
                <button class="expand-all" id="resetFilters" style="background: #6c757d; border-color: #6c757d;">Reset All Filters</button>
            </div>

            <div class="stats">
                <div class="stat">Sessions: <strong id="sessionCount">0</strong></div>
                <div class="stat">Papers: <strong id="paperCount">0</strong></div>
            </div>
        </aside>

        <main class="content">
            <div id="schedule">
                <div class="loading">Loading schedule...</div>
            </div>
        </main>

        <button class="mobile-filter-toggle" id="mobileFilterToggle">☰</button>
    </div>

    <script>
        let scheduleData = [];
        let allTracks = new Set();
        let allTimeSlotsData = [];
        const seenSlotKeys = new Set();

        const trackMap = {
            'General Industry Studies':                                          { short: 'General Industry',          color: '#E69F00' },
            'Health Care Systems, Biotechnology, and Pharmaceuticals':           { short: 'Health Care & Pharma',      color: '#56B4E9' },
            'Innovation, Entrepreneurship, and AI-Driven Transformation':        { short: 'Innovation & AI',           color: '#CC79A7' },
            'Labor Markets, Organizations, and the Future of Work':              { short: 'Labor & Work',              color: '#F0E442' },
            'Operations, Supply Chain, and AI-Enhanced Industry 4.0':            { short: 'Operations & Supply Chain', color: '#0072B2' },
            'Public Policy and Global Competitiveness':                          { short: 'Public Policy',             color: '#D55E00' },
            'Sustainable Innovation, Energy, and Mobility':                      { short: 'Sustainability & Energy',   color: '#009E73' }
        };

        // Load data
        fetch('schedule_data.json')
            .then(r => r.json())
            .then(data => {
                scheduleData = data;

                data.forEach(item => {
                    if (item.category) allTracks.add(item.category);
                    if (item.time_slot && item.day) {
                        const slotKey = `${item.time_slot}__${item.day}`;
                        if (!seenSlotKeys.has(slotKey)) {
                            seenSlotKeys.add(slotKey);
                            const timeLabel = item.start_time && item.end_time
                                ? `${item.day.substring(0,3)} ${formatTime(item.start_time)} – ${formatTime(item.end_time)}`
                                : `${item.day} ${item.time_slot}`;
                            allTimeSlotsData.push({
                                slot: item.time_slot,
                                day: item.day,
                                label: timeLabel,
                                start_time: item.start_time,
                                end_time: item.end_time,
                                order: item.time_order
                            });
                        }
                    }
                });

                // Populate track dropdown
                const trackFilter = document.getElementById('trackFilter');
                Array.from(allTracks).sort().forEach(track => {
                    const option = document.createElement('option');
                    option.value = track;
                    option.textContent = trackMap[track] ? trackMap[track].short : track;
                    trackFilter.appendChild(option);
                });

                trackFilter.addEventListener('change', function() {
                    const wrapper = this.closest('.track-select-wrapper');
                    const info = trackMap[this.value];
                    wrapper.style.setProperty('--track-color', info ? info.color : '#e5e5e5');
                });

                // Populate time slot dropdown (all slots initially)
                updateTimeSlotDropdown('');

                renderSchedule();
                attachEventListeners();
            })
            .catch(err => {
                document.getElementById('schedule').innerHTML =
                    `<div class="no-results"><h2>Error loading schedule</h2><p>${err.message}</p></div>`;
            });

        function attachEventListeners() {
            document.getElementById('search').addEventListener('input', () => { updateFilterIndicators(); renderSchedule(); });
            document.getElementById('timeSlotFilter').addEventListener('change', () => { updateFilterIndicators(); renderSchedule(); });
            document.getElementById('trackFilter').addEventListener('change', () => { updateFilterIndicators(); renderSchedule(); });
            document.getElementById('typeFilter').addEventListener('change', () => { updateFilterIndicators(); renderSchedule(); });
            document.getElementById('expandAll').addEventListener('click', () => expandCollapseAll(true));
            document.getElementById('collapseAll').addEventListener('click', () => expandCollapseAll(false));
            document.getElementById('resetFilters').addEventListener('click', resetAllFilters);

            document.querySelectorAll('.day-tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.day-tab').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    updateTimeSlotDropdown(this.getAttribute('data-day'));
                    updateFilterIndicators();
                    renderSchedule();
                });
            });

            const mobileToggle = document.getElementById('mobileFilterToggle');
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            mobileToggle.addEventListener('click', () => {
                sidebar.classList.add('mobile-open');
                overlay.classList.add('show');
            });
            overlay.addEventListener('click', () => {
                sidebar.classList.remove('mobile-open');
                overlay.classList.remove('show');
            });
        }

        function expandCollapseAll(expand) {
            document.querySelectorAll('.session-group').forEach(s => {
                s.classList.toggle('expanded', expand);
            });
        }

        function isSpecial(type) {
            return type === 'special_session' || type === 'plenary';
        }

        function renderSchedule() {
            const searchTerm   = document.getElementById('search').value.toLowerCase();
            const dayFilter    = document.querySelector('.day-tab.active').getAttribute('data-day');
            const slotFilter   = document.getElementById('timeSlotFilter').value;
            const trackFilter  = document.getElementById('trackFilter').value;
            const typeFilter   = document.getElementById('typeFilter').value;

            const filtered = scheduleData.filter(item => {
                const searchMatch = !searchTerm ||
                    (item.session_name && item.session_name.toLowerCase().includes(searchTerm)) ||
                    (item.title        && item.title.toLowerCase().includes(searchTerm))        ||
                    (item.authors      && item.authors.toLowerCase().includes(searchTerm))      ||
                    (item.abstract     && item.abstract.toLowerCase().includes(searchTerm))     ||
                    (item.moderator    && item.moderator.toLowerCase().includes(searchTerm))     ||
                    (item.discussant   && item.discussant.toLowerCase().includes(searchTerm))   ||
                    (item.session_chair && item.session_chair.toLowerCase().includes(searchTerm));

                const dayMatch  = !dayFilter   || item.day === dayFilter;
                const slotMatch = !slotFilter  || item.time_slot === slotFilter;
                const trackMatch = !trackFilter || item.category === trackFilter;
                const typeMatch = !typeFilter  ||
                    (typeFilter === 'paper'   && (item.type === 'paper' || item.type === 'self_organized_panel')) ||
                    (typeFilter === 'special' && isSpecial(item.type)) ||
                    (typeFilter === 'event'   && item.type === 'event');

                return searchMatch && dayMatch && slotMatch && trackMatch && typeMatch;
            });

            // Sort chronologically
            filtered.sort((a, b) => {
                if (a.time_order !== b.time_order) return a.time_order - b.time_order;
                const sa = String(a.session_id), sb = String(b.session_id);
                return sa.localeCompare(sb);
            });

            // Group by session
            const sessions = {};
            filtered.forEach(item => {
                const key = `${item.session_id}_${item.time_slot}`;
                if (!sessions[key]) {
                    sessions[key] = {
                        session_id:    item.session_id,
                        session_name:  item.session_name,
                        time_slot:     item.time_slot,
                        room:          item.room,
                        date:          item.date,
                        day:           item.day,
                        start_time:    item.start_time,
                        end_time:      item.end_time,
                        time_order:    item.time_order,
                        category:      item.category,
                        type:          item.type,
                        session_chair: item.session_chair || null,
                        discussant:    item.discussant    || null,
                        papers: []
                    };
                }
                sessions[key].papers.push(item);
            });

            const scheduleDiv = document.getElementById('schedule');
            const sessionList = Object.values(sessions);

            if (sessionList.length === 0) {
                scheduleDiv.innerHTML = '<div class="no-results"><h2>No results found</h2><p>Try adjusting your search or filters</p></div>';
                document.getElementById('sessionCount').textContent = '0';
                document.getElementById('paperCount').textContent = '0';
                return;
            }

            let html = '';
            let totalSessions = 0;
            let totalPapers = 0;

            sessionList.forEach(session => {
                const isEvent = session.type === 'event';
                const special = isSpecial(session.type);

                if (!isEvent) {
                    totalSessions++;
                    if (!special) totalPapers += session.papers.length;
                }

                const timeStr = session.start_time && session.end_time
                    ? `${formatTime(session.start_time)} – ${formatTime(session.end_time)}`
                    : session.time_slot;

                // Render events as a non-expandable banner card
                if (isEvent) {
                    html += `
                    <div class="session-group cat-event event-card">
                        <div class="session-header">
                            <div class="session-meta">
                                <div>
                                    <div class="session-title-row">
                                        <span class="session-title">${escapeHtml(session.session_name)}</span>
                                        <span class="session-badge badge-event">Social</span>
                                    </div>
                                    <div class="session-info">
                                        <span>📅 ${session.day}, ${formatDate(session.date)}</span>
                                        <span>🕒 ${timeStr}</span>
                                        <span>📍 ${session.room || 'TBA'}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>`;
                    return;
                }

                const categoryClass = special ? 'cat-special' : getCategoryClass(session.category);

                const badge = session.type === 'plenary'
                    ? '<span class="session-badge badge-plenary">Plenary</span>'
                    : session.type === 'special_session'
                    ? '<span class="session-badge badge-special">Special Session</span>'
                    : '';

                const typeLabel = session.type === 'plenary'        ? '🎤 Plenary Session'  :
                                  session.type === 'special_session' ? '🎤 Special Session' :
                                  `📄 ${session.papers.length} paper${session.papers.length !== 1 ? 's' : ''}`;

                const trackInfo = trackMap[session.category];
                const categoryLabel = trackInfo
                    ? `<span class="session-category" style="color:${trackInfo.color}">■ ${trackInfo.short}</span>`
                    : (session.category ? `<span class="session-category">${escapeHtml(session.category)}</span>` : '');

                const papersHtml = special
                    ? renderPanelContent(session.papers[0])
                    : session.papers.map(renderPaper).join('');

                const chairHtml = !special && session.session_chair
                    ? `<div class="session-chair"><strong>Session Chair:</strong> ${escapeHtml(session.session_chair)}</div>`
                    : '';

                const discussantHtml = !special && session.discussant
                    ? `<div class="session-discussant"><strong>Discussant:</strong> ${escapeHtml(session.discussant)}</div>`
                    : '';

                html += `
                    <div class="session-group ${categoryClass}">
                        <div class="session-header" onclick="toggleSession(this)">
                            <div class="session-meta">
                                <div>
                                    <div class="session-title-row">
                                        <span class="session-title">${escapeHtml(session.session_name || 'Untitled Session')}</span>
                                        ${badge}
                                    </div>
                                    <div class="session-info">
                                        <span>📅 ${session.day}, ${formatDate(session.date)}</span>
                                        <span>🕒 ${timeStr}</span>
                                        <span>📍 ${session.room || 'TBA'}</span>
                                        <span>${typeLabel}</span>
                                        ${categoryLabel}
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="session-papers">
                            ${chairHtml}${discussantHtml}${papersHtml}
                        </div>
                    </div>`;
            });

            scheduleDiv.innerHTML = html;
            document.getElementById('sessionCount').textContent = totalSessions;
            document.getElementById('paperCount').textContent = totalPapers;
        }

        function renderPaper(paper) {
            return `
                <div class="paper">
                    <div class="paper-title">${escapeHtml(paper.title || 'Untitled')}</div>
                    ${paper.authors ? `<div class="paper-authors">${escapeHtml(paper.authors)}</div>` : ''}
                    ${paper.abstract ? `
                        <button class="abstract-toggle" onclick="toggleAbstract(this, event)">View Abstract</button>
                        <div class="abstract" id="abstract-${paper.id}">${escapeHtml(paper.abstract)}</div>
                    ` : ''}
                </div>`;
        }

        function renderPanelContent(panel) {
            if (!panel) return '';

            const mod = panel.moderator && panel.moderator.trim() && panel.moderator.trim() !== 'TBD'
                ? `<div class="panel-moderator"><strong>Moderator:</strong> ${escapeHtml(panel.moderator.trim())}</div>`
                : '';

            let panelists = '';
            if (panel.panelists && panel.panelists.trim() && panel.panelists.trim() !== 'TBD') {
                const items = panel.panelists.split('\n').map(p => p.trim()).filter(p => p.length > 0);
                panelists = `<div class="panel-panelists"><strong>Panelists:</strong><ul>
                    ${items.map(p => `<li>${escapeHtml(p)}</li>`).join('')}
                </ul></div>`;
            }

            const desc = panel.abstract && panel.abstract.trim() && panel.abstract.trim() !== 'TBD'
                ? `<div class="panel-description">${escapeHtml(panel.abstract.trim())}</div>`
                : '';

            return `<div class="paper">${mod}${panelists}${desc}</div>`;
        }

        function toggleSession(element) {
            element.parentElement.classList.toggle('expanded');
        }

        function toggleAbstract(button, event) {
            event.stopPropagation();
            const abstract = button.nextElementSibling;
            abstract.classList.toggle('visible');
            button.textContent = abstract.classList.contains('visible') ? 'Hide Abstract' : 'View Abstract';
        }

        function formatTime(timeStr) {
            if (!timeStr) return '';
            const [hours, minutes] = timeStr.split(':');
            const h = parseInt(hours);
            const period = h >= 12 ? 'PM' : 'AM';
            const hour12 = h === 0 ? 12 : h > 12 ? h - 12 : h;
            return `${hour12}:${minutes} ${period}`;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const date = new Date(dateStr + 'T00:00:00');
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function updateTimeSlotDropdown(selectedDay) {
            const timeSlotFilter = document.getElementById('timeSlotFilter');
            const currentSlot = timeSlotFilter.value;

            timeSlotFilter.innerHTML = '<option value="">All Time Slots</option>';

            const slots = selectedDay
                ? allTimeSlotsData.filter(ts => ts.day === selectedDay)
                : allTimeSlotsData;

            slots.slice().sort((a, b) => a.order - b.order).forEach(ts => {
                const option = document.createElement('option');
                option.value = ts.slot;
                option.textContent = selectedDay
                    ? (ts.start_time && ts.end_time
                        ? `${formatTime(ts.start_time)} – ${formatTime(ts.end_time)}`
                        : ts.slot)
                    : ts.label;
                option.setAttribute('data-day', ts.day);
                timeSlotFilter.appendChild(option);
            });

            timeSlotFilter.value = slots.some(ts => ts.slot === currentSlot) ? currentSlot : '';
        }

        function updateFilterIndicators() {
            const searchVal  = document.getElementById('search').value;
            const slotVal    = document.getElementById('timeSlotFilter').value;
            const trackVal   = document.getElementById('trackFilter').value;
            const typeVal    = document.getElementById('typeFilter').value;

            document.querySelector('label[for="search"]').classList.toggle('filter-active', !!searchVal);
            document.querySelector('label[for="timeSlotFilter"]').classList.toggle('filter-active', !!slotVal);
            document.querySelector('label[for="trackFilter"]').classList.toggle('filter-active', !!trackVal);
            document.querySelector('label[for="typeFilter"]').classList.toggle('filter-active', !!typeVal);
        }

        function resetAllFilters() {
            document.getElementById('search').value = '';
            document.getElementById('timeSlotFilter').value = '';
            document.getElementById('trackFilter').value = '';
            document.getElementById('typeFilter').value = '';

            document.getElementById('trackFilter')
                .closest('.track-select-wrapper')
                .style.setProperty('--track-color', '#e5e5e5');

            document.querySelectorAll('.day-tab').forEach(t => t.classList.remove('active'));
            document.querySelector('.day-tab[data-day=""]').classList.add('active');

            updateTimeSlotDropdown('');
            updateFilterIndicators();
            renderSchedule();
        }

        function getCategoryClass(category) {
            if (!category) return '';
            if (category.includes('General Industry Studies'))                                       return 'cat-general';
            if (category.includes('Health Care') || category.includes('Pharmaceuticals'))           return 'cat-health';
            if (category.includes('Labor Markets') || category.includes('Future of Work'))          return 'cat-labor';
            if (category.includes('Operations') || category.includes('Supply Chain'))               return 'cat-operations';
            if (category.includes('Public Policy') || category.includes('Global Competitiveness'))  return 'cat-policy';
            if (category.includes('Sustainable Innovation') || category.includes('Energy'))         return 'cat-sustainability';
            if (category.includes('Innovation') || category.includes('Entrepreneurship'))           return 'cat-innovation';
            return '';
        }
    </script>
</body>
</html>
